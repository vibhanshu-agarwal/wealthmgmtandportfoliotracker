plugins {
    id 'java'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // Required to compile @ConditionalOnBean(OtlpGrpcSpanExporter.class) and wrap Boot's gRPC exporter.
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    // Library modules do not apply the Boot plugin, which normally adds this for Gradle 9.
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
