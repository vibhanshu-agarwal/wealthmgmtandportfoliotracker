spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # spring.data.redis.* intentionally absent — lives only in application-local.yml
  # No default-filters here — any RequestRateLimiter reference triggers Redis autoconfiguration
  # on startup, which crashes deployments where no Redis is present (e.g. AWS without ElastiCache)

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # B2 Task 5.2 — manual demo reset. Ordered ahead of portfolio-service (default order
            # 0) because /api/portfolio/** would otherwise win and proxy the public path straight
            # through. It ONLY rewrites the path: the method stays PUT and the request body
            # (including expectedVersion) is forwarded byte-for-byte. Authorization and the
            # internal-key swap belong to DemoResetAuthorizationFilter, which requires this exact
            # route id to have won.
            - id: demo-reset-manual
              uri: ${app.routes.portfolio-url}
              order: -1
              predicates:
                - Path=/api/portfolio/demo-reset
                - Method=PUT
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/portfolio/demo-reset
                    replacement: /api/internal/portfolio/demo-reset
            - id: portfolio-service
              uri: ${app.routes.portfolio-url}
              predicates:
                - Path=/api/portfolio/**
            - id: asset-discovery
              uri: ${app.routes.portfolio-url}
              predicates:
                - Path=/api/assets/**
            - id: market-data-service
              uri: ${app.routes.market-data-url}
              predicates:
                - Path=/api/market/**
            - id: insight-service
              uri: ${app.routes.insight-url}
              predicates:
                - Path=/api/insights/**
            - id: insight-chat
              uri: ${app.routes.insight-url}
              predicates:
                - Path=/api/chat/**
            # Golden-State E2E seeder routes. The gateway is a dumb router for /api/internal/**:
            # no JWT, no origin-verify, no X-User-Id injection. Each downstream service
            # validates X-Internal-Api-Key itself (see InternalApiKeyFilter).
            - id: internal-portfolio-seed
              uri: ${app.routes.portfolio-url}
              predicates:
                - Path=/api/internal/portfolio/**
            - id: internal-market-data-seed
              uri: ${app.routes.market-data-url}
              predicates:
                - Path=/api/internal/market-data/**
            - id: internal-insight-seed
              uri: ${app.routes.insight-url}
              predicates:
                - Path=/api/internal/insight/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.version: ${SERVICE_VERSION:local}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:local}
    tracing:
      sampler: parent-based-trace-id-ratio
      limits:
        max-attribute-value-length: 512
        max-attributes: 64
        max-events: 16
        max-links: 8
      export:
        max-queue-size: 2048
        max-batch-size: 512
        schedule-delay: 5s
        timeout: 30s
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          compression: gzip
          connect-timeout: 10s

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${OTEL_SERVICE_NAME:${spring.application.name:}},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}   # local/aws profiles — must be >= 32 bytes for HS256
  jwk-uri: ${AUTH_JWK_URI:}       # reserved for a future external-IdP profile; not active in current aws auth path

app:
  demo-presence:
    ttl: ${APP_DEMO_PRESENCE_TTL:150s}
  routes:
    # Single source of truth for downstream service URL defaults.
    # Each route above references ${app.routes.*-url} so a default-port change
    # requires editing exactly one line here instead of every route entry.
    portfolio-url: ${PORTFOLIO_SERVICE_URL:http://localhost:8081}
    market-data-url: ${MARKET_DATA_SERVICE_URL:http://localhost:8082}
    insight-url: ${INSIGHT_SERVICE_URL:http://localhost:8083}
  cors:
    allowed-origin-patterns: "http://localhost:3000,http://127.0.0.1:3000"
