plugins {
    id 'org.springframework.boot'
    id 'org.springframework.boot.aot'
    id 'jacoco'
}

// Test AOT is only needed for GraalVM native test compilation (not a goal here).
// Disabling avoids Testcontainers-based integration tests failing during processTestAot
// because containers are not running at build time.
tasks.named('processTestAot') { enabled = false }

dependencies {
    implementation project(':common-dto')
    implementation 'org.springframework.cloud:spring-cloud-starter'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OAuth2 resource server (spring-security-oauth2-resource-server, Nimbus JOSE+JWT, WebFlux security)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Blocking JDBC for the auth data layer (Req 2.5: no spring-boot-starter-data-jpa in a
    // WebFlux app — plain spring-jdbc + HikariCP, bridged via Schedulers.boundedElastic()).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    // Distributed tracing — Boot 4.1 starter bundles micrometer-tracing-bridge-otel + OTLP export
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

    // Testcontainers — versions managed by testcontainers-bom in root build.gradle
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'

    // jjwt — test-only JWT builder for integration tests
    testImplementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

    // jqwik powers property-based tests for the production-rate-limiting spec
    // (key-resolver spoof-resistance property).
    testImplementation "net.jqwik:jqwik:${rootProject.ext.jqwikVersion}"

    // Testcontainers Postgres for the auth integration test suite (Task 8). Artifact id carries
    // the "testcontainers-" prefix (not the bare "postgres") to match this repo's
    // testcontainers-bom 2.0.5 module naming — see portfolio-service/build.gradle and
    // market-data-service/build.gradle for the same convention.
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    // Flyway — test-only, used programmatically (Flyway.configure()...migrate()) by
    // AuthIntegrationTest to run portfolio-service's migrations against the Testcontainers
    // Postgres BEFORE the gateway's ApplicationContext starts. api-gateway itself never depends
    // on Flyway in src/main — DataSourceAutoConfiguration is excluded in ApiGatewayApplication and
    // this module owns no migrations of its own (see BetterAuthArchitectureTest). Versions are
    // managed by Spring Boot's dependency-management BOM, matching portfolio-service's own
    // flyway-database-postgresql (no explicit version here).
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'

    // ArchUnit — guards the "no software.amazon.awssdk.* / io.lettuce.* imports in
    // com.wealth.gateway (beyond the pre-existing RedisSslConfig)" rule (Req 2.2).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
}

// JaCoCo coverage — scoped to api-gateway only (per the production-rate-limiting spec's
// >80% coverage requirement). Report is built from BOTH the fast 'test' task and the
// Testcontainers-backed 'integrationTest' task, since ProductionRateLimitingIntegrationTest
// exercises code paths (Redis-backed limiter beans, fail-open behavior) that the unit-level
// tests alone cannot reach.
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('integrationTest') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')) {
        include '*.exec'
    })
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoRateLimitingCoverageCheck', JacocoCoverageVerification) {
    description = 'Verifies >80% instruction coverage for the production-rate-limiting classes'
    group = 'verification'
    dependsOn tasks.named('jacocoTestReport')
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')) {
        include '*.exec'
    })
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs).collect {
        fileTree(it) {
            include 'com/wealth/gateway/GatewayRateLimitConfig.class',
                    'com/wealth/gateway/RateLimitDenialResponseCustomizer.class',
                    'com/wealth/gateway/RedisRateLimitStateLogger.class'
        }
    })
    sourceDirectories.setFrom(files('src/main/java'))
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}
