spring:
  application:
    name: market-data-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mongodb:
    # Spring Boot 4 binds MongoDB connection settings from spring.mongodb.*.
    # Keep accepting the legacy SPRING_DATA_MONGODB_URI env var while preferring
    # SPRING_MONGODB_URI for new deployments.
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/market_db}}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: true

app:
  catalog:
    reject-unsupported-events: false
    enforce-holding-invariant: false
  internal:
    # Shared secret gating /api/internal/** endpoints (Golden-State seeder).
    # Injected at runtime via the Lambda INTERNAL_API_KEY env var; blank in local dev
    # unless explicitly exported, in which case the InternalApiKeyFilter fails closed with 503.
    api-key: ${INTERNAL_API_KEY:}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.version: ${SERVICE_VERSION:local}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:local}
    tracing:
      sampler: parent-based-trace-id-ratio
      limits:
        max-attribute-value-length: 512
        max-attributes: 64
        max-events: 16
        max-links: 8
      export:
        max-queue-size: 2048
        max-batch-size: 512
        schedule-delay: 5s
        timeout: 30s
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          compression: gzip
          connect-timeout: 10s

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${OTEL_SERVICE_NAME:${spring.application.name:}},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

market:
  seed:
    enabled: true
    fixture-path: classpath:fixtures/market-seed-data.json

market-data:
  refresh:
    enabled: true
    cron: "0 0 */1 * * *" # every 1 hour (Spring 6-field: sec min hour dom month dow)

external-market-data:
  provider: yahoo
  base-url: https://query1.finance.yahoo.com
  timeout-ms: 5000
  max-retries: 3
  backoff-ms: 500
  batch-size: 50
  # Yahoo's /v7/finance/quote endpoint requires a browser-like User-Agent plus a
  # session cookie + crumb handshake (cookie-url -> crumb-path), otherwise it returns
  # 401 Unauthorized. These defaults work as-is; override only if Yahoo changes hosts.
  # NOTE (known fragility): this is an unofficial endpoint — see docs/todos/backlog.
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  cookie-url: https://fc.yahoo.com/
  crumb-path: /v1/test/getcrumb

resilience4j:
  retry:
    instances:
      externalMarketData:
        maxAttempts: 3
        waitDuration: 5s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized
