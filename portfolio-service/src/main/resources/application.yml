spring:
  application:
    name: portfolio-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db?options=-c%20timezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:wealth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:wealth_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: portfolio-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  catalog:
    reject-unsupported-events: false
    enforce-holding-invariant: false
  internal:
    # Shared secret gating /api/internal/** endpoints (Golden-State seeder).
    # Injected at runtime via the Lambda INTERNAL_API_KEY env var; blank in local dev
    # unless explicitly exported, in which case the InternalApiKeyFilter fails closed with 503.
    api-key: ${INTERNAL_API_KEY:}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.version: ${SERVICE_VERSION:local}
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:local}
    tracing:
      sampler: parent-based-trace-id-ratio
      limits:
        max-attribute-value-length: 512
        max-attributes: 64
        max-events: 16
        max-links: 8
      export:
        max-queue-size: 2048
        max-batch-size: 512
        schedule-delay: 5s
        timeout: 30s
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          compression: gzip
          connect-timeout: 10s

logging:
  level:
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${OTEL_SERVICE_NAME:${spring.application.name:}},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
