plugins {
    id 'org.springframework.boot'
    id 'org.springframework.boot.aot'
}

// processTestAot tries to AOT-process every @SpringBootTest class at build time,
// including Testcontainers-based integration tests. Those tests use @DynamicPropertySource
// with container::getJdbcUrl lambdas — which fail because no container is running during
// AOT processing. Test AOT is only needed for GraalVM native test compilation, which is
// not a goal for this JVM deployment. Disable it to keep the build clean.
tasks.named('processTestAot') { enabled = false }

processResources {
    from(rootProject.file('config/seed-tickers.json')) { into 'catalog' }
}

dependencies {
    implementation project(':common-dto')
    implementation project(':common-observability')
    implementation project(':common-catalog')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation "org.wiremock.integrations:wiremock-spring-boot:${rootProject.ext.wiremockSpringBootVersion}"
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation "au.com.dius.pact.provider:spring7:${rootProject.ext.pactSpring7Version}"
    // jqwik powers preservation property tests for price-update-stale-jackson3-regression spec.
    testImplementation "net.jqwik:jqwik:${rootProject.ext.jqwikVersion}"
}

tasks.register('specA912ConnectionOriginProbe', JavaExec) {
    description = 'Manual, separately authorized, read-only Spec A 9.12 connection-origin probe'
    group = 'diagnostics'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wealth.portfolio.seed.rca.SpecA912ConnectionOriginProbe'
}

tasks.register('specA912StatementHistoryProbe', JavaExec) {
    description = 'Manual, separately authorized, read-only Spec A 9.12 statement-history probe'
    group = 'diagnostics'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wealth.portfolio.seed.rca.SpecA912StatementHistoryProbe'
}
