# terraform-azure.yml
#
# Azure Terraform workflow — validates and applies the Azure Container Apps
# infrastructure defined in infrastructure/terraform/azure/.
#
# Plan path        : runs on every pull_request touching the Azure Terraform root,
#                     and on manual dispatch with action=plan.
#                     Writes a backend_override.tf that swaps the azurerm backend for
#                     a local backend, so no real backend credentials are required
#                     for PR validation (backend-azure.hcl is gitignored). This path
#                     is STRUCTURAL ONLY — it cannot preview the real production delta.
#
# Remote-plan path : runs ONLY on manual dispatch with action=remote-plan. Real
#                     backend, read-only (plan, never apply) — the way to actually see
#                     what a live-state change will do before authorizing it.
#
# Apply path       : runs ONLY on manual dispatch with action=apply.
#                     Provisions the real backend-azure.hcl from the AZURE_BACKEND_HCL
#                     secret before initialising Terraform. Gated behind the
#                     `production` GitHub Environment (required-reviewer approval).
#
# Live-state hardening (Spec A checkpoint-9.9 prerequisite, 2026-08-23): remote-plan
# and apply now require expected_main_sha (dispatch must target the exact commit
# intended, not whatever main has drifted to) and deployed_image_tags_json (explicit four-key
# JSON map — TF_VAR_image_tags no longer silently defaults to the dispatch commit's own SHA for
# these operations, which would otherwise change SERVICE_VERSION on every app/Job to
# an unrelated IaC commit while the actual, lifecycle-ignored image stayed on
# whatever was last deployed). validate_dispatch.py enforces both, plus that the
# dispatch targets refs/heads/main and that the two 9.9 change profiles never combine
# with the seed-image/Job-recreate recovery flags. See
# .kiro/specs/supported-asset-integrity/tasks.md checkpoint 9.9 and
# docs/superpowers/plans/2026-08-23-spec-a-checkpoint-9.9-execution.md.
#
# Authentication uses OIDC (azure/login@v2) — no client_secret is used or stored.

name: Terraform Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        options:
          - plan
          - remote-plan
          - apply
        default: plan
      expected_main_sha:
        description: >
          Required for remote-plan/apply: the full commit SHA on main you intend to run
          against. Must match the SHA this workflow actually dispatches against, and the
          dispatch must target main itself, or it fails closed before touching Azure.
        required: false
        type: string
        default: ""
      deployed_image_tags_json:
        description: >
          Required for remote-plan/apply: JSON object with exactly api-gateway,
          portfolio-service, market-data-service, and insight-service keys, each mapped to
          the full 40-character SERVICE_VERSION tag currently deployed for that service.
          Records live image identity for truthful planning — it does not select an image
          to roll out. Sets TF_VAR_image_tags explicitly for live-state operations.
        required: false
        type: string
        default: ""
      expected_portfolio_image_digest:
        description: >
          Required for any 9.12 profile and for spec-a-9.13-restore-scale: the independently
          verified sha256 digest currently running in wealthprodacr/portfolio-service.
        required: false
        type: string
        default: ""
      change_profile:
        description: >
          standard = ordinary apply, no extra scope assertion. spec-a-9.9-enable /
          spec-a-9.9-abort = checkpoint 9.9's cutover/rollback, asserted to touch
          exactly the three catalog-service Container Apps as in-place updates.
          spec-a-9.11-enable / spec-a-9.11-abort = checkpoint 9.11's persist-refresh
          enablement/abort, asserted to touch only the market-data refresh Job as an
          in-place runner-env update.           spec-a-9.12-enable / spec-a-9.12-disable =
          checkpoint 9.12's one-shot demo portfolio activation/deactivation.
          spec-a-9.12-tx-diag-enable / spec-a-9.12-tx-diag-disable =
          checkpoint 9.12's startup transaction diagnostics (demo seed remains false).
          spec-a-9.13-restore-scale = checkpoint 9.13's restore of catalog-consumer
          min_replicas 1 -> 0 with enforcement overrides remaining absent.
          spec-a-9.14-reopen-ingress / spec-a-9.14-close-ingress = checkpoint 9.14's
          reopen or rollback of api-gateway ingress only (in-place update, image unchanged).
          api-gateway-custom-domain-restore / api-gateway-custom-domain-remove = guarded
          restore or removal of api.vibhanshu-ai-portfolio.dev hostname presence.
        type: choice
        options:
          - standard
          - spec-a-9.9-enable
          - spec-a-9.9-abort
          - spec-a-9.11-enable
          - spec-a-9.11-abort
          - spec-a-9.12-enable
          - spec-a-9.12-disable
          - spec-a-9.12-tx-diag-enable
          - spec-a-9.12-tx-diag-disable
          - spec-a-9.13-restore-scale
          - spec-a-9.14-reopen-ingress
          - spec-a-9.14-close-ingress
          - api-gateway-custom-domain-restore
          - api-gateway-custom-domain-remove
        default: standard
      use_seed_image:
        description: "Use public seed image for Container Apps (true for first apply before images exist in ACR)"
        type: boolean
        default: false
      recreate_market_data_job:
        description: "Recovery: destroy+recreate market-data-refresh-job (terraform -replace). Auto-uses a Job-only seed image; do NOT also set use_seed_image (that would repoint the live apps' ingress port)."
        type: boolean
        default: false
  pull_request:
    paths:
      - "infrastructure/terraform/azure/**"
      - ".github/workflows/terraform-azure.yml"

# Serialize runs so concurrent plans/applies do not race on the same remote state.
concurrency:
  group: terraform-azure-${{ github.repository }}
  cancel-in-progress: false

# OIDC token + PR comment permissions — declared here, not inherited.
permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: infrastructure/terraform/azure

env:
  TF_INPUT: "false"
  TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # Structural (pr-plan) path uses variables.tf image_tags defaults ("latest" placeholders).
  # Live-state remote-plan/apply override TF_VAR_image_tags from deployed_image_tags_json.
  TF_VAR_demo_seed_on_startup: ${{ github.event.inputs.change_profile == 'spec-a-9.12-enable' && 'true' || 'false' }}
  TF_VAR_demo_tx_diagnostics: ${{ github.event.inputs.change_profile == 'spec-a-9.12-tx-diag-enable' && 'true' || 'false' }}
  TF_VAR_api_gateway_ingress_enabled: ${{ github.event.inputs.change_profile == 'spec-a-9.14-close-ingress' && 'false' || 'true' }}
  TF_VAR_api_gateway_custom_domain_enabled: ${{ contains(fromJSON('["api-gateway-custom-domain-remove","spec-a-9.14-close-ingress","spec-a-9.14-reopen-ingress"]'), github.event.inputs.change_profile) && 'false' || 'true' }}
  TF_VAR_use_seed_image: ${{ github.event.inputs.use_seed_image || 'false' }}
  # Job-only seed bootstrap, auto-enabled whenever a Job recreate is requested. This lets the
  # -replace create the Job on the public seed image WITHOUT setting the global use_seed_image
  # (which would repoint the four long-running apps' ingress target_port 8080 -> 80).
  TF_VAR_market_data_refresh_job_use_seed_image: ${{ github.event.inputs.recreate_market_data_job || 'false' }}
  TF_VAR_auth_jwt_secret: ${{ secrets.AUTH_JWT_SECRET }}
  TF_VAR_app_auth_email: ${{ secrets.E2E_TEST_USER_EMAIL }}
  TF_VAR_app_auth_password: ${{ secrets.E2E_TEST_USER_PASSWORD }}
  TF_VAR_app_auth_user_id: ${{ secrets.E2E_TEST_USER_ID || '00000000-0000-0000-0000-000000000e2e' }}
  TF_VAR_app_auth_name: ${{ secrets.E2E_TEST_USER_NAME || 'Demo User' }}
  TF_VAR_postgres_connection_string: ${{ secrets.POSTGRES_CONNECTION_STRING }}
  TF_VAR_postgres_username: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
  TF_VAR_postgres_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
  TF_VAR_mongodb_connection_string: ${{ secrets.MONGODB_CONNECTION_STRING }}
  TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
  TF_VAR_kafka_bootstrap_servers: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
  TF_VAR_kafka_sasl_username: ${{ secrets.KAFKA_SASL_USERNAME }}
  TF_VAR_kafka_sasl_password: ${{ secrets.KAFKA_SASL_PASSWORD }}
  TF_VAR_internal_api_key: ${{ secrets.TF_VAR_INTERNAL_API_KEY }}

jobs:
  # ===========================================================================
  # pr-plan: unchanged structural plan — local backend, PR-triggered or
  # action=plan. Cannot preview the real production delta; use remote-plan for that.
  # ===========================================================================
  pr-plan:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    name: Terraform Azure (structural plan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Overrides the azurerm backend declared in versions.tf with a local backend so
      # plan can run without the AZURE_BACKEND_HCL secret. Terraform auto-merges any
      # *_override.tf file with the main configuration, so the committed
      # `backend "azurerm" {}` block is replaced for this run only. Gitignored.
      - name: Override backend for plan (local backend)
        run: |
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF

      - name: Terraform Init (plan — local backend override)
        run: terraform init

      - name: Terraform Validate (plan)
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Show (JSON)
        run: terraform show -json tfplan > tfplan.json

      - name: Assert Plan — P1 Profile Mutual Exclusion (MANDATORY)
        run: python3 scripts/assert_plan.py tfplan.json

      - name: Assert Plan — P5 ACR Pull Authorization (MANDATORY)
        run: python3 scripts/test_acr_pull_property.py tfplan.json

      - name: Assert Plan — Observability Caps, Budget, No Scheduled Alerts (MANDATORY)
        run: python3 scripts/assert_observability_plan.py tfplan.json

      - name: Assert Plan — Job runner env update is in-place (MANDATORY)
        run: python3 scripts/assert_job_runner_env_update.py tfplan.json

      - name: Assert Plan — ingress_enabled does not replace gateway (MANDATORY)
        run: python3 scripts/assert_ingress_enabled_plan.py tfplan.json

      - name: Assert Plan — Mongo repair Job contract (MANDATORY)
        run: python3 scripts/assert_mongo_repair_job_plan.py tfplan.json

  # ===========================================================================
  # validate-dispatch: fail closed before touching Azure at all, for any live-state
  # operation (remote-plan or apply).
  # ===========================================================================
  validate-dispatch:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'remote-plan' || github.event.inputs.action == 'apply')
    name: Validate live-state dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canonical_image_tags_json: ${{ steps.validate-dispatch.outputs.canonical_image_tags_json }}
      canonical_image_digests_json: ${{ steps.confirm-image-tags.outputs.canonical_image_digests_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dispatch inputs
        id: validate-dispatch
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha }}
          DEPLOYED_IMAGE_TAGS_JSON: ${{ github.event.inputs.deployed_image_tags_json }}
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
          CHANGE_PROFILE: ${{ github.event.inputs.change_profile }}
          USE_SEED_IMAGE: ${{ github.event.inputs.use_seed_image }}
          RECREATE_MARKET_DATA_JOB: ${{ github.event.inputs.recreate_market_data_job }}
        run: python3 scripts/validate_dispatch.py

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm expected_portfolio_image_digest resolves in ACR
        if: 'github.event.inputs.change_profile == ''spec-a-9.12-enable'' || github.event.inputs.change_profile == ''spec-a-9.12-disable'' || github.event.inputs.change_profile == ''spec-a-9.12-tx-diag-enable'' || github.event.inputs.change_profile == ''spec-a-9.12-tx-diag-disable'' || github.event.inputs.change_profile == ''spec-a-9.13-restore-scale'''
        env:
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
        run: |
          set -euo pipefail
          DIGEST="$EXPECTED_PORTFOLIO_IMAGE_DIGEST"
          COUNT=$(az acr manifest list-metadata --registry wealthprodacr --name portfolio-service \
            --query "length([?digest == '${DIGEST}'])" -o tsv)
          if [ "$COUNT" != "1" ]; then
            echo "::error::expected_portfolio_image_digest must resolve to exactly one manifest in wealthprodacr/portfolio-service."
            exit 1
          fi
          echo "OK: expected portfolio image digest resolves to exactly one manifest."

      # deployed_image_tags_json passed the format check above; now prove each supplied tag
      # exists in its own ACR repository AND capture that tag's exact manifest digest, so a
      # later plan cannot pin SERVICE_VERSION to the declared tag while swapping in an
      # unrelated historical digest from the same repository.
      # Skipped ONLY for standard + use_seed_image=true: that's the first-provisioning
      # bootstrap path, before any real service image (or possibly the registry itself)
      # exists — deployed_image_tags_json is meaningless there. Every other combination,
      # including both 9.9 profiles and ordinary non-seed applies, still requires it.
      - name: Confirm deployed_image_tags_json resolves in ACR
        id: confirm-image-tags
        if: '! (github.event.inputs.change_profile == ''standard'' && github.event.inputs.use_seed_image == ''true'')'
        env:
          CANONICAL_IMAGE_TAGS_JSON: ${{ steps.validate-dispatch.outputs.canonical_image_tags_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          DIGEST = re.compile(r"^sha256:[0-9a-f]{64}$")
          SERVICES = (
              "api-gateway",
              "portfolio-service",
              "market-data-service",
              "insight-service",
          )
          tags = json.loads(os.environ["CANONICAL_IMAGE_TAGS_JSON"])
          digests = {}
          for repo in SERVICES:
              tag = tags[repo]
              result = subprocess.run(
                  [
                      "az", "acr", "manifest", "list-metadata",
                      "--registry", "wealthprodacr",
                      "--name", repo,
                      "--query", f"[?tags != null && contains(tags, '{tag}')].digest",
                      "-o", "tsv",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              resolved = [line.strip() for line in result.stdout.splitlines() if line.strip()]
              if len(resolved) != 1:
                  print(
                      f"::error::deployed_image_tags_json[{repo!r}]={tag!r} resolves to "
                      f"{len(resolved)} manifest(s) in wealthprodacr/{repo} (expected exactly 1).",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              digest = resolved[0]
              if not DIGEST.fullmatch(digest):
                  print(
                      f"::error::ACR digest for {repo}:{tag} is not a canonical sha256 digest: {digest!r}.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              digests[repo] = digest
              print(f"OK: {repo}:{tag} resolves to exactly one manifest {digest}.")

          payload = json.dumps({service: digests[service] for service in SERVICES}, separators=(",", ":"))
          output_path = os.environ.get("GITHUB_OUTPUT")
          if not output_path:
              print("::error::GITHUB_OUTPUT is not set; cannot export canonical image digests.", file=sys.stderr)
              sys.exit(1)
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"canonical_image_digests_json<<EOF\n{payload}\nEOF\n")
          PY

  # ===========================================================================
  # remote-plan: real backend, read-only. The only way to preview the actual
  # production delta before authorizing an apply.
  # ===========================================================================
  remote-plan:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'remote-plan'
    needs: validate-dispatch
    name: Terraform Azure (remote plan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_VAR_image_tags: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Backend Config
        env:
          BACKEND_HCL_CONTENT: ${{ secrets.AZURE_BACKEND_HCL }}
        run: |
          printf '%s' "$BACKEND_HCL_CONTENT" > backend-azure.hcl
          echo "--- backend-azure.hcl keys written ---"
          grep -o '^[^=]*' backend-azure.hcl | sed 's/^/  /' || true

      - name: Terraform Init (remote-plan — real backend)
        run: terraform init -backend-config=backend-azure.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Custom-domain restore preflight (read-only)
        id: custom-domain-preflight
        if: github.event.inputs.change_profile == 'api-gateway-custom-domain-restore'
        run: |
          set -euo pipefail
          APP_JSON="$(az containerapp show \
            --name api-gateway \
            --resource-group wealth-azure-prod-rg \
            --query '{
              id:id,
              fqdn:properties.configuration.ingress.fqdn,
              customDomainVerificationId:properties.customDomainVerificationId,
              latestRevisionName:properties.latestRevisionName,
              latestReadyRevisionName:properties.latestReadyRevisionName,
              ingress:{
                external:properties.configuration.ingress.external,
                allowInsecure:properties.configuration.ingress.allowInsecure,
                targetPort:properties.configuration.ingress.targetPort,
                transport:properties.configuration.ingress.transport,
                traffic:properties.configuration.ingress.traffic
              },
              customDomains:properties.configuration.ingress.customDomains
            }' -o json)"
          CERT_JSON="$(az containerapp env certificate list \
            --name wealth-prod-aca-env \
            --resource-group wealth-azure-prod-rg \
            --query '[].{name:name,id:id,subjectName:properties.subjectName,provisioningState:properties.provisioningState,validationMethod:properties.validationMethod}' -o json)"
          CNAME_TARGET="$(dig +short CNAME api.vibhanshu-ai-portfolio.dev | tr -d '\r' | sed 's/\.$//' | head -n1)"
          TXT_VALUES="$(python3 - <<'PY'
          import json, subprocess
          result = subprocess.run(
              ["dig", "+short", "TXT", "asuid.api.vibhanshu-ai-portfolio.dev"],
              capture_output=True,
              text=True,
              check=True,
          )
          values = []
          for line in result.stdout.splitlines():
              line = line.strip().strip('"')
              if line:
                  values.append(line)
          print(json.dumps(values))
          PY
          )"
          python3 scripts/validate_api_gateway_custom_domain.py restore-preflight \
            --app-json "$APP_JSON" \
            --certificates-json "$CERT_JSON" \
            --cname-target "$CNAME_TARGET" \
            --txt-values-json "$TXT_VALUES"

      - name: Custom-domain remove preflight (read-only)
        id: custom-domain-remove-preflight
        if: github.event.inputs.change_profile == 'api-gateway-custom-domain-remove'
        run: |
          set -euo pipefail
          APP_JSON="$(az containerapp show \
            --name api-gateway \
            --resource-group wealth-azure-prod-rg \
            --query '{
              id:id,
              customDomains:properties.configuration.ingress.customDomains
            }' -o json)"
          CERT_JSON="$(az containerapp env certificate list \
            --name wealth-prod-aca-env \
            --resource-group wealth-azure-prod-rg \
            --query '[].{name:name,id:id,subjectName:properties.subjectName,provisioningState:properties.provisioningState,validationMethod:properties.validationMethod}' -o json)"
          python3 scripts/validate_api_gateway_custom_domain.py remove-preflight \
            --app-json "$APP_JSON" \
            --certificates-json "$CERT_JSON"

      - name: Terraform Plan (read-only)
        run: terraform plan -out=tfplan

      - name: Terraform Show (JSON)
        run: terraform show -json tfplan > tfplan.json

      - name: Assert Plan — No in-place Job identity migration (MANDATORY)
        run: python3 scripts/assert_job_identity_migration.py tfplan.json

      - name: Assert Plan — P1 Profile Mutual Exclusion (MANDATORY)
        run: python3 scripts/assert_plan.py tfplan.json

      - name: Assert Plan — P5 ACR Pull Authorization (MANDATORY)
        run: python3 scripts/test_acr_pull_property.py tfplan.json

      - name: Assert Plan — Observability Caps, Budget, No Scheduled Alerts (MANDATORY)
        run: python3 scripts/assert_observability_plan.py tfplan.json

      - name: Assert Plan — Job runner env update is in-place (MANDATORY)
        run: python3 scripts/assert_job_runner_env_update.py tfplan.json

      - name: Assert Plan — ingress_enabled does not replace gateway (MANDATORY)
        run: python3 scripts/assert_ingress_enabled_plan.py tfplan.json

      - name: Assert Plan — Mongo repair Job contract (MANDATORY)
        run: python3 scripts/assert_mongo_repair_job_plan.py tfplan.json

      # Runs for every change_profile, not only the two 9.9 profiles: under standard /
      # 9.11 / 9.12 this is a guard forbidding any change to the 9.9 protected surface
      # (min_replicas, the two catalog-override env vars) on the three services — not a
      # no-op. Once the 9.9 desired-state change lands in main.tf, a dispatch left on a
      # non-9.9 profile must not be able to apply it without going through the
      # exact-scope proof below.
      - name: Assert Plan — Spec A 9.9 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
          EXPECTED_IMAGE_DIGESTS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_digests_json }}
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
        run: python3 scripts/assert_spec_a_9_9_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON" --expected-image-digests-json "$EXPECTED_IMAGE_DIGESTS_JSON" --expected-image-digest "$EXPECTED_PORTFOLIO_IMAGE_DIGEST"

      # Runs for every change_profile: under standard/9.9/9.12 this forbids any runner-env
      # transition; under 9.11 enable/abort it proves the exact one-Job in-place update.
      # Not run in the empty-backend structural PR plan (greenfield create is not the
      # live false->true transition).
      - name: Assert Plan — Spec A 9.11 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
        run: python3 scripts/assert_spec_a_9_11_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON"

      - name: Assert Plan — Spec A 9.12 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
        run: python3 scripts/assert_spec_a_9_12_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-digest "$EXPECTED_PORTFOLIO_IMAGE_DIGEST" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON"

      - name: Assert Plan — Spec A 9.13 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
          EXPECTED_IMAGE_DIGESTS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_digests_json }}
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
        run: python3 scripts/assert_spec_a_9_13_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-digest "$EXPECTED_PORTFOLIO_IMAGE_DIGEST" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON" --expected-image-digests-json "$EXPECTED_IMAGE_DIGESTS_JSON"

      - name: Assert Plan — Spec A 9.14 profile guard / exact scope
        run: python3 scripts/assert_spec_a_9_14_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}"

      - name: Assert Plan — api-gateway custom-domain guard / exact scope
        env:
          EXPECTED_GATEWAY_ID: ${{ steps.custom-domain-preflight.outputs.gateway_id || steps.custom-domain-remove-preflight.outputs.gateway_id }}
        run: |
          set -euo pipefail
          ARGS=(tfplan.json --profile "${{ github.event.inputs.change_profile }}")
          if [ -n "${EXPECTED_GATEWAY_ID:-}" ]; then
            ARGS+=(--expected-gateway-id "$EXPECTED_GATEWAY_ID")
          fi
          python3 scripts/assert_api_gateway_custom_domain_plan.py "${ARGS[@]}"

      # Sanitized summary only — built from tfplan.json via summarize_plan.py, which
      # emits ONLY "<address> <actions>" per changed resource, never attribute paths,
      # before/after objects, or values. `terraform show`'s human-readable output was
      # tried first and rejected: its changed-attribute lines (e.g. `~ value = "..."`)
      # match the same prefix characters as the resource-header lines, so a text-based
      # filter over it could not be trusted not to leak a TF_VAR_*-sourced value. Never
      # upload raw tfplan/tfplan.json either, for the same reason.
      - name: Publish sanitized plan summary
        run: |
          {
            echo "### Terraform remote-plan summary"
            echo ""
            echo "Profile: \`${{ github.event.inputs.change_profile }}\`"
            echo ""
            echo '```'
            python3 scripts/summarize_plan.py tfplan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # apply: real backend, mutates production. `needs: validate-dispatch` means the
  # cheap fail-closed guards run and pass BEFORE the `production` Environment's
  # required-reviewer approval is ever requested (GitHub evaluates a job's `needs:`
  # before its own environment protection rules). Creates its own fresh plan in this
  # same run and applies that exact plan — never accepts a plan artifact from another
  # run (remote-plan's plan is preview-only). `environment:` is valid directly on
  # this job because it is an ordinary job, not a `uses:` reusable-workflow call —
  # confirmed with actionlint, not assumed (a job calling a reusable workflow cannot
  # declare `environment:` at all; that constraint doesn't apply here).
  # ===========================================================================
  apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: validate-dispatch
    name: Terraform Azure (apply)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      TF_VAR_image_tags: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Guard — reject unsafe recovery flag combination
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.recreate_market_data_job }}" = "true" ] && [ "${{ github.event.inputs.use_seed_image }}" = "true" ]; then
            echo "::error::Do not combine use_seed_image=true with recreate_market_data_job=true."
            echo "::error::The global use_seed_image flag flips all four Container Apps' ingress target_port to 80"
            echo "::error::(target_port is NOT in the module's ignore_changes), which breaks live apps serving on 8080."
            echo "::error::Job recovery already uses a Job-only seed image automatically — rerun with recreate_market_data_job=true ONLY (use_seed_image=false)."
            exit 1
          fi
          echo "Recovery flag combination OK."

      - name: Provision Backend Config
        # AZURE_BACKEND_HCL secret contains the HCL content set via:
        #   gh secret set AZURE_BACKEND_HCL < infrastructure/terraform/azure/backend-azure.hcl
        # The secret is written to a file using an env var to avoid shell interpolation issues.
        # Values must be quoted strings in HCL format, e.g.:
        #   resource_group_name  = "wealth-tf-state-rg"
        #   storage_account_name = "wealthtfstate"
        env:
          BACKEND_HCL_CONTENT: ${{ secrets.AZURE_BACKEND_HCL }}
        run: |
          printf '%s' "$BACKEND_HCL_CONTENT" > backend-azure.hcl
          echo "--- backend-azure.hcl keys written ---"
          grep -o '^[^=]*' backend-azure.hcl | sed 's/^/  /' || true

      - name: Terraform Init (apply — real backend)
        run: terraform init -backend-config=backend-azure.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Custom-domain restore preflight (read-only)
        id: custom-domain-preflight
        if: github.event.inputs.change_profile == 'api-gateway-custom-domain-restore'
        run: |
          set -euo pipefail
          APP_JSON="$(az containerapp show \
            --name api-gateway \
            --resource-group wealth-azure-prod-rg \
            --query '{
              id:id,
              fqdn:properties.configuration.ingress.fqdn,
              customDomainVerificationId:properties.customDomainVerificationId,
              latestRevisionName:properties.latestRevisionName,
              latestReadyRevisionName:properties.latestReadyRevisionName,
              ingress:{
                external:properties.configuration.ingress.external,
                allowInsecure:properties.configuration.ingress.allowInsecure,
                targetPort:properties.configuration.ingress.targetPort,
                transport:properties.configuration.ingress.transport,
                traffic:properties.configuration.ingress.traffic
              },
              customDomains:properties.configuration.ingress.customDomains
            }' -o json)"
          CERT_JSON="$(az containerapp env certificate list \
            --name wealth-prod-aca-env \
            --resource-group wealth-azure-prod-rg \
            --query '[].{name:name,id:id,subjectName:properties.subjectName,provisioningState:properties.provisioningState,validationMethod:properties.validationMethod}' -o json)"
          CNAME_TARGET="$(dig +short CNAME api.vibhanshu-ai-portfolio.dev | tr -d '\r' | sed 's/\.$//' | head -n1)"
          TXT_VALUES="$(python3 - <<'PY'
          import json, subprocess
          result = subprocess.run(
              ["dig", "+short", "TXT", "asuid.api.vibhanshu-ai-portfolio.dev"],
              capture_output=True,
              text=True,
              check=True,
          )
          values = []
          for line in result.stdout.splitlines():
              line = line.strip().strip('"')
              if line:
                  values.append(line)
          print(json.dumps(values))
          PY
          )"
          python3 scripts/validate_api_gateway_custom_domain.py restore-preflight \
            --app-json "$APP_JSON" \
            --certificates-json "$CERT_JSON" \
            --cname-target "$CNAME_TARGET" \
            --txt-values-json "$TXT_VALUES"

      - name: Custom-domain remove preflight (read-only)
        id: custom-domain-remove-preflight
        if: github.event.inputs.change_profile == 'api-gateway-custom-domain-remove'
        run: |
          set -euo pipefail
          APP_JSON="$(az containerapp show \
            --name api-gateway \
            --resource-group wealth-azure-prod-rg \
            --query '{
              id:id,
              customDomains:properties.configuration.ingress.customDomains
            }' -o json)"
          CERT_JSON="$(az containerapp env certificate list \
            --name wealth-prod-aca-env \
            --resource-group wealth-azure-prod-rg \
            --query '[].{name:name,id:id,subjectName:properties.subjectName,provisioningState:properties.provisioningState,validationMethod:properties.validationMethod}' -o json)"
          python3 scripts/validate_api_gateway_custom_domain.py remove-preflight \
            --app-json "$APP_JSON" \
            --certificates-json "$CERT_JSON"

      # For scoped Spec A profiles (9.9, 9.11, and 9.12) this is READ-ONLY: `terraform import`
      # mutates the real backend's state immediately, before any plan or assertion runs —
      # during a cutover that would be a state mutation outside the declared resource
      # scope, invisible to the profile-guard assertions (which only ever see the plan
      # that comes *after* state already changed). If the Job is unexpectedly absent from
      # state during a scoped Spec A apply, stop; state repair is a separate, reviewed
      # operation, not something to fold silently into a cutover.
      # standard keeps the original auto-import recovery behavior unchanged.
      - name: Import existing market-data refresh Job (apply recovery)
        run: |
          set -euo pipefail

          RESOURCE_ADDRESS="azurerm_container_app_job.market_data_refresh"
          JOB_NAME="market-data-refresh-job"
          RESOURCE_GROUP="wealth-azure-prod-rg"
          PROFILE="${{ github.event.inputs.change_profile }}"

          if terraform state show "$RESOURCE_ADDRESS" >/dev/null 2>&1; then
            echo "${RESOURCE_ADDRESS} is already managed in Terraform state."
            exit 0
          fi

          if [ "$PROFILE" = "spec-a-9.9-enable" ] || [ "$PROFILE" = "spec-a-9.9-abort" ] \
            || [ "$PROFILE" = "spec-a-9.11-enable" ] || [ "$PROFILE" = "spec-a-9.11-abort" ] \
            || [ "$PROFILE" = "spec-a-9.12-enable" ] || [ "$PROFILE" = "spec-a-9.12-disable" ] \
            || [ "$PROFILE" = "spec-a-9.12-tx-diag-enable" ] || [ "$PROFILE" = "spec-a-9.12-tx-diag-disable" ] \
            || [ "$PROFILE" = "spec-a-9.13-restore-scale" ] \
            || [ "$PROFILE" = "spec-a-9.14-reopen-ingress" ] \
            || [ "$PROFILE" = "spec-a-9.14-close-ingress" ] \
            || [ "$PROFILE" = "api-gateway-custom-domain-restore" ] \
            || [ "$PROFILE" = "api-gateway-custom-domain-remove" ]; then
            echo "::error::${RESOURCE_ADDRESS} is not in Terraform state, and change_profile=${PROFILE} only permits a read-only check here — auto-import is not allowed during a scoped Spec A production change, since it would mutate the backend before any plan or assertion runs."
            echo "::error::Repair state through a separate, reviewed operation (e.g. dispatch with change_profile=standard first) before retrying the scoped Spec A apply."
            exit 1
          fi

          JOB_ID="$(az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv 2>/dev/null || true)"

          if [ -z "$JOB_ID" ]; then
            echo "${JOB_NAME} does not exist yet; Terraform will create it."
            exit 0
          fi

          echo "Importing existing ${JOB_NAME} into Terraform state."
          terraform import "$RESOURCE_ADDRESS" "$JOB_ID"

      # Recovery: when recreate_market_data_job=true, the plan below is generated with
      # -replace so the Job is destroyed and recreated. The user-assigned identity and its
      # AcrPull role assignment (which do NOT depend on the Job) are created first, so the
      # fresh Job is provisioned with pull access already in place. The recreate also
      # auto-enables the Job-ONLY seed image (TF_VAR_market_data_refresh_job_use_seed_image,
      # set from this input in the env block) so the create never blocks on an ACR pull —
      # without touching the four long-running apps. deploy-azure.yml then rolls the real image.
      - name: Terraform Plan (apply — for assertions)
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.recreate_market_data_job }}" = "true" ]; then
            echo "Recovery requested: replacing azurerm_container_app_job.market_data_refresh"
            terraform plan -replace=azurerm_container_app_job.market_data_refresh -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Terraform Show (JSON — apply)
        run: terraform show -json tfplan > tfplan.json

      - name: Assert Plan — No in-place Job identity migration (MANDATORY)
        # Blocks a plain apply from planning the SystemAssigned -> UserAssigned in-place
        # migration (which can stall on ACA Job provisioning) and steers the operator to
        # rerun with recreate_market_data_job=true (forced -replace).
        run: python3 scripts/assert_job_identity_migration.py tfplan.json

      - name: Assert Plan — Recovery is Job-scoped (recovery only)
        if: github.event.inputs.recreate_market_data_job == 'true'
        run: python3 scripts/assert_recovery_plan.py tfplan.json

      - name: Assert Plan — P1 Profile Mutual Exclusion (MANDATORY)
        run: python3 scripts/assert_plan.py tfplan.json

      - name: Assert Plan — P5 ACR Pull Authorization (MANDATORY)
        run: python3 scripts/test_acr_pull_property.py tfplan.json

      - name: Assert Plan — Observability Caps, Budget, No Scheduled Alerts (MANDATORY)
        run: python3 scripts/assert_observability_plan.py tfplan.json

      - name: Assert Plan — Job runner env update is in-place (MANDATORY)
        run: python3 scripts/assert_job_runner_env_update.py tfplan.json

      - name: Assert Plan — ingress_enabled does not replace gateway (MANDATORY)
        run: python3 scripts/assert_ingress_enabled_plan.py tfplan.json

      - name: Assert Plan — Mongo repair Job contract (MANDATORY)
        run: python3 scripts/assert_mongo_repair_job_plan.py tfplan.json

      # Runs for every change_profile, not only the two 9.9 profiles: under standard /
      # 9.11 / 9.12 this is a guard forbidding any change to the 9.9 protected surface
      # (min_replicas, the two catalog-override env vars) on the three services — not a
      # no-op. Once the 9.9 desired-state change lands in main.tf, a dispatch left on a
      # non-9.9 profile must not be able to apply it without going through the
      # exact-scope proof below.
      - name: Assert Plan — Spec A 9.9 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
          EXPECTED_IMAGE_DIGESTS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_digests_json }}
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
        run: python3 scripts/assert_spec_a_9_9_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON" --expected-image-digests-json "$EXPECTED_IMAGE_DIGESTS_JSON" --expected-image-digest "$EXPECTED_PORTFOLIO_IMAGE_DIGEST"

      - name: Assert Plan — Spec A 9.11 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
        run: python3 scripts/assert_spec_a_9_11_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON"

      - name: Assert Plan — Spec A 9.12 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
        run: python3 scripts/assert_spec_a_9_12_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-digest "$EXPECTED_PORTFOLIO_IMAGE_DIGEST" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON"

      - name: Assert Plan — Spec A 9.13 profile guard / exact scope
        env:
          EXPECTED_IMAGE_TAGS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_tags_json }}
          EXPECTED_IMAGE_DIGESTS_JSON: ${{ needs.validate-dispatch.outputs.canonical_image_digests_json }}
          EXPECTED_PORTFOLIO_IMAGE_DIGEST: ${{ github.event.inputs.expected_portfolio_image_digest }}
        run: python3 scripts/assert_spec_a_9_13_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}" --expected-image-digest "$EXPECTED_PORTFOLIO_IMAGE_DIGEST" --expected-image-tags-json "$EXPECTED_IMAGE_TAGS_JSON" --expected-image-digests-json "$EXPECTED_IMAGE_DIGESTS_JSON"

      - name: Assert Plan — Spec A 9.14 profile guard / exact scope
        run: python3 scripts/assert_spec_a_9_14_plan.py tfplan.json --profile "${{ github.event.inputs.change_profile }}"

      - name: Assert Plan — api-gateway custom-domain guard / exact scope
        env:
          EXPECTED_GATEWAY_ID: ${{ steps.custom-domain-preflight.outputs.gateway_id || steps.custom-domain-remove-preflight.outputs.gateway_id }}
        run: |
          set -euo pipefail
          ARGS=(tfplan.json --profile "${{ github.event.inputs.change_profile }}")
          if [ -n "${EXPECTED_GATEWAY_ID:-}" ]; then
            ARGS+=(--expected-gateway-id "$EXPECTED_GATEWAY_ID")
          fi
          python3 scripts/assert_api_gateway_custom_domain_plan.py "${ARGS[@]}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Bind existing managed certificate to custom domain (restore only)
        if: github.event.inputs.change_profile == 'api-gateway-custom-domain-restore'
        env:
          EXPECTED_CERTIFICATE_ID: ${{ steps.custom-domain-preflight.outputs.certificate_id }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_CERTIFICATE_ID:-}" ]; then
            echo "::error::restore bind requires the preflight-resolved certificate id."
            exit 1
          fi
          az containerapp hostname bind \
            --name api-gateway \
            --resource-group wealth-azure-prod-rg \
            --environment wealth-prod-aca-env \
            --hostname api.vibhanshu-ai-portfolio.dev \
            --certificate "$EXPECTED_CERTIFICATE_ID" \
            --validation-method CNAME

      - name: Post-bind custom-domain verification (restore only)
        if: github.event.inputs.change_profile == 'api-gateway-custom-domain-restore'
        env:
          PREFLIGHT_OUTPUTS: ${{ toJSON(steps.custom-domain-preflight.outputs) }}
        run: |
          set -euo pipefail
          probe_health_url() {
            local url="$1"
            local label="$2"
            local start end elapsed status curl_exit
            start=$(date +%s.%N)
            status=$(curl --max-time 30 -s -o /dev/null -w '%{http_code}' "$url") || true
            curl_exit=$?
            end=$(date +%s.%N)
            elapsed=$(python3 -c "print(f'{float(\"$end\") - float(\"$start\"):.3f}')")
            if [ "$curl_exit" -ne 0 ]; then
              status="000"
            fi
            echo "${label}: url=${url} http_status=${status} curl_exit=${curl_exit} duration_s=${elapsed}"
            PROBE_LAST_STATUS="$status"
          }
          APP_JSON="$(az containerapp show \
            --name api-gateway \
            --resource-group wealth-azure-prod-rg \
            --query '{
              fqdn:properties.configuration.ingress.fqdn,
              latestRevisionName:properties.latestRevisionName,
              latestReadyRevisionName:properties.latestReadyRevisionName,
              ingress:{
                external:properties.configuration.ingress.external,
                allowInsecure:properties.configuration.ingress.allowInsecure,
                targetPort:properties.configuration.ingress.targetPort,
                transport:properties.configuration.ingress.transport,
                traffic:properties.configuration.ingress.traffic
              },
              customDomains:properties.configuration.ingress.customDomains
            }' -o json)"
          CERT_JSON="$(az containerapp env certificate list \
            --name wealth-prod-aca-env \
            --resource-group wealth-azure-prod-rg \
            --query '[].{name:name,id:id,subjectName:properties.subjectName,provisioningState:properties.provisioningState,validationMethod:properties.validationMethod}' -o json)"
          DEFAULT_FQDN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["fqdn"])' <<<"$APP_JSON")"
          CUSTOM_HEALTH_URL="https://api.vibhanshu-ai-portfolio.dev/actuator/health"
          DEFAULT_HEALTH_URL="https://${DEFAULT_FQDN}/actuator/health"
          echo "=== custom-host warm-up (informational; timeout/503 are not binding failures) ==="
          probe_health_url "$CUSTOM_HEALTH_URL" "custom-host warm-up"
          REQUIRED_CONSECUTIVE_CUSTOM_200=3
          MAX_CUSTOM_HEALTH_ATTEMPTS=15
          CUSTOM_HEALTH_RETRY_DELAY_S=5
          consecutive=0
          attempt=0
          while [ "$consecutive" -lt "$REQUIRED_CONSECUTIVE_CUSTOM_200" ] && [ "$attempt" -lt "$MAX_CUSTOM_HEALTH_ATTEMPTS" ]; do
            attempt=$((attempt + 1))
            probe_health_url "$CUSTOM_HEALTH_URL" "custom-host stability attempt ${attempt}"
            if [ "$PROBE_LAST_STATUS" = "200" ]; then
              consecutive=$((consecutive + 1))
              echo "custom-host consecutive 200 count: ${consecutive}/${REQUIRED_CONSECUTIVE_CUSTOM_200}"
            else
              consecutive=0
              echo "custom-host non-200 (${PROBE_LAST_STATUS}); resetting consecutive count"
              if [ "$attempt" -lt "$MAX_CUSTOM_HEALTH_ATTEMPTS" ]; then
                sleep "$CUSTOM_HEALTH_RETRY_DELAY_S"
              fi
            fi
          done
          if [ "$consecutive" -lt "$REQUIRED_CONSECUTIVE_CUSTOM_200" ]; then
            echo "::error::custom-host health did not reach ${REQUIRED_CONSECUTIVE_CUSTOM_200} consecutive HTTP 200 responses within ${MAX_CUSTOM_HEALTH_ATTEMPTS} attempts (last status=${PROBE_LAST_STATUS}). Retry after cold-start warm-up or investigate api-gateway scale/revision health."
            exit 1
          fi
          CUSTOM_STATUS="200"
          probe_health_url "$DEFAULT_HEALTH_URL" "default ACA FQDN health"
          DEFAULT_STATUS="$PROBE_LAST_STATUS"
          TLS_EVIDENCE="$(echo | openssl s_client -connect api.vibhanshu-ai-portfolio.dev:443 -servername api.vibhanshu-ai-portfolio.dev 2>/dev/null | openssl x509 -noout -subject -dates -ext subjectAltName)"
          EXPECTED_JSON="$(python3 - <<'PY'
          import json, os
          outputs = json.loads(os.environ["PREFLIGHT_OUTPUTS"])
          print(json.dumps({
              "certificate_id": outputs.get("certificate_id", ""),
              "revision_name": outputs.get("revision_name", ""),
          }))
          PY
          )"
          python3 scripts/validate_api_gateway_custom_domain.py post-bind \
            --app-json "$APP_JSON" \
            --certificates-json "$CERT_JSON" \
            --expected-json "$EXPECTED_JSON" \
            --default-health-status "$DEFAULT_STATUS" \
            --custom-health-status "$CUSTOM_STATUS" \
            --tls-evidence "$TLS_EVIDENCE"

      - name: Post-remove custom-domain verification (remove only)
        if: github.event.inputs.change_profile == 'api-gateway-custom-domain-remove'
        run: |
          set -euo pipefail
          APP_JSON="$(az containerapp show \
            --name api-gateway \
            --resource-group wealth-azure-prod-rg \
            --query '{customDomains:properties.configuration.ingress.customDomains}' -o json)"
          CERT_JSON="$(az containerapp env certificate list \
            --name wealth-prod-aca-env \
            --resource-group wealth-azure-prod-rg \
            --query '[].{name:name,id:id,subjectName:properties.subjectName,provisioningState:properties.provisioningState,validationMethod:properties.validationMethod}' -o json)"
          python3 scripts/validate_api_gateway_custom_domain.py remove-post \
            --app-json "$APP_JSON" \
            --certificates-json "$CERT_JSON"
