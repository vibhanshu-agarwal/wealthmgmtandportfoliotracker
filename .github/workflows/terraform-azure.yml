# terraform-azure.yml
#
# Azure Terraform workflow — validates and applies the Azure Container Apps
# infrastructure defined in infrastructure/terraform/azure/.
#
# Plan path        : runs on every pull_request touching the Azure Terraform root,
#                     and on manual dispatch with action=plan.
#                     Writes a backend_override.tf that swaps the azurerm backend for
#                     a local backend, so no real backend credentials are required
#                     for PR validation (backend-azure.hcl is gitignored). This path
#                     is STRUCTURAL ONLY — it cannot preview the real production delta.
#
# Remote-plan path : runs ONLY on manual dispatch with action=remote-plan. Real
#                     backend, read-only (plan, never apply) — the way to actually see
#                     what a live-state change will do before authorizing it.
#
# Apply path       : runs ONLY on manual dispatch with action=apply.
#                     Provisions the real backend-azure.hcl from the AZURE_BACKEND_HCL
#                     secret before initialising Terraform. Gated behind the
#                     `production` GitHub Environment (required-reviewer approval).
#
# Live-state hardening (Spec A checkpoint-9.9 prerequisite, 2026-08-23): remote-plan
# and apply now require expected_main_sha (dispatch must target the exact commit
# intended, not whatever main has drifted to) and deployed_image_tag (explicit —
# TF_VAR_image_tag no longer silently defaults to the dispatch commit's own SHA for
# these operations, which would otherwise change SERVICE_VERSION on every app/Job to
# an unrelated IaC commit while the actual, lifecycle-ignored image stayed on
# whatever was last deployed). validate_dispatch.py enforces both, plus that the
# dispatch targets refs/heads/main and that the two 9.9 change profiles never combine
# with the seed-image/Job-recreate recovery flags. See
# .kiro/specs/supported-asset-integrity/tasks.md checkpoint 9.9 and
# docs/superpowers/plans/2026-08-23-spec-a-checkpoint-9.9-execution.md.
#
# Authentication uses OIDC (azure/login@v2) — no client_secret is used or stored.

name: Terraform Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        options:
          - plan
          - remote-plan
          - apply
        default: plan
      expected_main_sha:
        description: >
          Required for remote-plan/apply: the full commit SHA on main you intend to run
          against. Must match the SHA this workflow actually dispatches against, and the
          dispatch must target main itself, or it fails closed before touching Azure.
        required: false
        type: string
        default: ""
      deployed_image_tag:
        description: >
          Required for remote-plan/apply: the full 40-character image tag currently
          deployed to the four Container Apps (e.g. the R4 tag during checkpoint 9.9).
          Sets TF_VAR_image_tag explicitly for live-state operations so SERVICE_VERSION
          cannot silently drift to this workflow's own dispatch commit.
        required: false
        type: string
        default: ""
      change_profile:
        description: >
          standard = ordinary apply, no extra scope assertion. spec-a-9.9-enable /
          spec-a-9.9-abort = checkpoint 9.9's cutover/rollback, asserted to touch
          exactly the three catalog-service Container Apps as in-place updates.
        type: choice
        options:
          - standard
          - spec-a-9.9-enable
          - spec-a-9.9-abort
        default: standard
      use_seed_image:
        description: "Use public seed image for Container Apps (true for first apply before images exist in ACR)"
        type: boolean
        default: false
      recreate_market_data_job:
        description: "Recovery: destroy+recreate market-data-refresh-job (terraform -replace). Auto-uses a Job-only seed image; do NOT also set use_seed_image (that would repoint the live apps' ingress port)."
        type: boolean
        default: false
  pull_request:
    paths:
      - "infrastructure/terraform/azure/**"
      - ".github/workflows/terraform-azure.yml"

# Serialize runs so concurrent plans/applies do not race on the same remote state.
concurrency:
  group: terraform-azure-${{ github.repository }}
  cancel-in-progress: false

# OIDC token + PR comment permissions — declared here, not inherited.
permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: infrastructure/terraform/azure

env:
  TF_INPUT: "false"
  TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # Structural (pr-plan) path only — live-state jobs override this with deployed_image_tag.
  TF_VAR_image_tag: ${{ github.sha }}
  TF_VAR_use_seed_image: ${{ github.event.inputs.use_seed_image || 'false' }}
  # Job-only seed bootstrap, auto-enabled whenever a Job recreate is requested. This lets the
  # -replace create the Job on the public seed image WITHOUT setting the global use_seed_image
  # (which would repoint the four long-running apps' ingress target_port 8080 -> 80).
  TF_VAR_market_data_refresh_job_use_seed_image: ${{ github.event.inputs.recreate_market_data_job || 'false' }}
  TF_VAR_auth_jwt_secret: ${{ secrets.AUTH_JWT_SECRET }}
  TF_VAR_app_auth_email: ${{ secrets.E2E_TEST_USER_EMAIL }}
  TF_VAR_app_auth_password: ${{ secrets.E2E_TEST_USER_PASSWORD }}
  TF_VAR_app_auth_user_id: ${{ secrets.E2E_TEST_USER_ID || '00000000-0000-0000-0000-000000000e2e' }}
  TF_VAR_app_auth_name: ${{ secrets.E2E_TEST_USER_NAME || 'Demo User' }}
  TF_VAR_postgres_connection_string: ${{ secrets.POSTGRES_CONNECTION_STRING }}
  TF_VAR_postgres_username: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
  TF_VAR_postgres_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
  TF_VAR_mongodb_connection_string: ${{ secrets.MONGODB_CONNECTION_STRING }}
  TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
  TF_VAR_kafka_bootstrap_servers: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
  TF_VAR_kafka_sasl_username: ${{ secrets.KAFKA_SASL_USERNAME }}
  TF_VAR_kafka_sasl_password: ${{ secrets.KAFKA_SASL_PASSWORD }}
  TF_VAR_internal_api_key: ${{ secrets.TF_VAR_INTERNAL_API_KEY }}

jobs:
  # ===========================================================================
  # pr-plan: unchanged structural plan — local backend, PR-triggered or
  # action=plan. Cannot preview the real production delta; use remote-plan for that.
  # ===========================================================================
  pr-plan:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    name: Terraform Azure (structural plan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Overrides the azurerm backend declared in versions.tf with a local backend so
      # plan can run without the AZURE_BACKEND_HCL secret. Terraform auto-merges any
      # *_override.tf file with the main configuration, so the committed
      # `backend "azurerm" {}` block is replaced for this run only. Gitignored.
      - name: Override backend for plan (local backend)
        run: |
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF

      - name: Terraform Init (plan — local backend override)
        run: terraform init

      - name: Terraform Validate (plan)
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Show (JSON)
        run: terraform show -json tfplan > tfplan.json

      - name: Assert Plan — P1 Profile Mutual Exclusion (MANDATORY)
        run: python3 scripts/assert_plan.py tfplan.json

      - name: Assert Plan — P5 ACR Pull Authorization (MANDATORY)
        run: python3 scripts/test_acr_pull_property.py tfplan.json

      - name: Assert Plan — Observability Caps, Budget, No Scheduled Alerts (MANDATORY)
        run: python3 scripts/assert_observability_plan.py tfplan.json

      - name: Assert Plan — Job runner env update is in-place (MANDATORY)
        run: python3 scripts/assert_job_runner_env_update.py tfplan.json

      - name: Assert Plan — ingress_enabled does not replace gateway (MANDATORY)
        run: python3 scripts/assert_ingress_enabled_plan.py tfplan.json

      - name: Assert Plan — Mongo repair Job contract (MANDATORY)
        run: python3 scripts/assert_mongo_repair_job_plan.py tfplan.json

  # ===========================================================================
  # validate-dispatch: fail closed before touching Azure at all, for any live-state
  # operation (remote-plan or apply).
  # ===========================================================================
  validate-dispatch:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'remote-plan' || github.event.inputs.action == 'apply')
    name: Validate live-state dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dispatch inputs
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_MAIN_SHA: ${{ github.event.inputs.expected_main_sha }}
          DEPLOYED_IMAGE_TAG: ${{ github.event.inputs.deployed_image_tag }}
          CHANGE_PROFILE: ${{ github.event.inputs.change_profile }}
          USE_SEED_IMAGE: ${{ github.event.inputs.use_seed_image }}
          RECREATE_MARKET_DATA_JOB: ${{ github.event.inputs.recreate_market_data_job }}
        run: python3 infrastructure/terraform/azure/scripts/validate_dispatch.py

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # deployed_image_tag passed the format check above; now prove it actually exists
      # in ACR for every service this workflow can touch, so a typo'd or stale tag
      # cannot silently apply as SERVICE_VERSION against a manifest that isn't real.
      - name: Confirm deployed_image_tag resolves in ACR
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.deployed_image_tag }}"
          for REPO in portfolio-service market-data-service insight-service api-gateway; do
            COUNT=$(az acr manifest list-metadata --registry wealthprodacr --name "$REPO" \
              --query "length([?tags != null && contains(tags, '${TAG}')])" -o tsv)
            if [ "$COUNT" != "1" ]; then
              echo "::error::deployed_image_tag '${TAG}' resolves to ${COUNT} manifest(s) in wealthprodacr/${REPO} (expected exactly 1)."
              exit 1
            fi
            echo "OK: ${REPO}:${TAG} resolves to exactly one manifest."
          done

  # ===========================================================================
  # remote-plan: real backend, read-only. The only way to preview the actual
  # production delta before authorizing an apply.
  # ===========================================================================
  remote-plan:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'remote-plan'
    needs: validate-dispatch
    name: Terraform Azure (remote plan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_VAR_image_tag: ${{ github.event.inputs.deployed_image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provision Backend Config
        env:
          BACKEND_HCL_CONTENT: ${{ secrets.AZURE_BACKEND_HCL }}
        run: |
          printf '%s' "$BACKEND_HCL_CONTENT" > backend-azure.hcl
          echo "--- backend-azure.hcl keys written ---"
          grep -o '^[^=]*' backend-azure.hcl | sed 's/^/  /' || true

      - name: Terraform Init (remote-plan — real backend)
        run: terraform init -backend-config=backend-azure.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (read-only)
        run: terraform plan -out=tfplan

      - name: Terraform Show (JSON)
        run: terraform show -json tfplan > tfplan.json

      - name: Assert Plan — No in-place Job identity migration (MANDATORY)
        run: python3 scripts/assert_job_identity_migration.py tfplan.json

      - name: Assert Plan — P1 Profile Mutual Exclusion (MANDATORY)
        run: python3 scripts/assert_plan.py tfplan.json

      - name: Assert Plan — P5 ACR Pull Authorization (MANDATORY)
        run: python3 scripts/test_acr_pull_property.py tfplan.json

      - name: Assert Plan — Observability Caps, Budget, No Scheduled Alerts (MANDATORY)
        run: python3 scripts/assert_observability_plan.py tfplan.json

      - name: Assert Plan — Job runner env update is in-place (MANDATORY)
        run: python3 scripts/assert_job_runner_env_update.py tfplan.json

      - name: Assert Plan — ingress_enabled does not replace gateway (MANDATORY)
        run: python3 scripts/assert_ingress_enabled_plan.py tfplan.json

      - name: Assert Plan — Mongo repair Job contract (MANDATORY)
        run: python3 scripts/assert_mongo_repair_job_plan.py tfplan.json

      - name: Assert Plan — Spec A 9.9 exact scope (enable profile)
        if: github.event.inputs.change_profile == 'spec-a-9.9-enable'
        run: python3 scripts/assert_spec_a_9_9_plan.py tfplan.json --profile enable

      - name: Assert Plan — Spec A 9.9 exact scope (abort profile)
        if: github.event.inputs.change_profile == 'spec-a-9.9-abort'
        run: python3 scripts/assert_spec_a_9_9_plan.py tfplan.json --profile abort

      # Sanitized summary only — never upload raw tfplan/tfplan.json, which can contain
      # sensitive values (connection strings, secrets passed as TF_VAR_*).
      - name: Publish sanitized plan summary
        run: |
          {
            echo "### Terraform remote-plan summary"
            echo ""
            echo "Profile: \`${{ github.event.inputs.change_profile }}\`"
            echo ""
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*(#|~|\+|-) ' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # apply: real backend, mutates production. `needs: validate-dispatch` means the
  # cheap fail-closed guards run and pass BEFORE the `production` Environment's
  # required-reviewer approval is ever requested (GitHub evaluates a job's `needs:`
  # before its own environment protection rules). Creates its own fresh plan in this
  # same run and applies that exact plan — never accepts a plan artifact from another
  # run (remote-plan's plan is preview-only). `environment:` is valid directly on
  # this job because it is an ordinary job, not a `uses:` reusable-workflow call —
  # confirmed with actionlint, not assumed (a job calling a reusable workflow cannot
  # declare `environment:` at all; that constraint doesn't apply here).
  # ===========================================================================
  apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: validate-dispatch
    name: Terraform Azure (apply)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      TF_VAR_image_tag: ${{ github.event.inputs.deployed_image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Guard — reject unsafe recovery flag combination
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.recreate_market_data_job }}" = "true" ] && [ "${{ github.event.inputs.use_seed_image }}" = "true" ]; then
            echo "::error::Do not combine use_seed_image=true with recreate_market_data_job=true."
            echo "::error::The global use_seed_image flag flips all four Container Apps' ingress target_port to 80"
            echo "::error::(target_port is NOT in the module's ignore_changes), which breaks live apps serving on 8080."
            echo "::error::Job recovery already uses a Job-only seed image automatically — rerun with recreate_market_data_job=true ONLY (use_seed_image=false)."
            exit 1
          fi
          echo "Recovery flag combination OK."

      - name: Provision Backend Config
        # AZURE_BACKEND_HCL secret contains the HCL content set via:
        #   gh secret set AZURE_BACKEND_HCL < infrastructure/terraform/azure/backend-azure.hcl
        # The secret is written to a file using an env var to avoid shell interpolation issues.
        # Values must be quoted strings in HCL format, e.g.:
        #   resource_group_name  = "wealth-tf-state-rg"
        #   storage_account_name = "wealthtfstate"
        env:
          BACKEND_HCL_CONTENT: ${{ secrets.AZURE_BACKEND_HCL }}
        run: |
          printf '%s' "$BACKEND_HCL_CONTENT" > backend-azure.hcl
          echo "--- backend-azure.hcl keys written ---"
          grep -o '^[^=]*' backend-azure.hcl | sed 's/^/  /' || true

      - name: Terraform Init (apply — real backend)
        run: terraform init -backend-config=backend-azure.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Import existing market-data refresh Job (apply recovery)
        run: |
          set -euo pipefail

          RESOURCE_ADDRESS="azurerm_container_app_job.market_data_refresh"
          JOB_NAME="market-data-refresh-job"
          RESOURCE_GROUP="wealth-azure-prod-rg"

          if terraform state show "$RESOURCE_ADDRESS" >/dev/null 2>&1; then
            echo "${RESOURCE_ADDRESS} is already managed in Terraform state."
            exit 0
          fi

          JOB_ID="$(az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv 2>/dev/null || true)"

          if [ -z "$JOB_ID" ]; then
            echo "${JOB_NAME} does not exist yet; Terraform will create it."
            exit 0
          fi

          echo "Importing existing ${JOB_NAME} into Terraform state."
          terraform import "$RESOURCE_ADDRESS" "$JOB_ID"

      # Recovery: when recreate_market_data_job=true, the plan below is generated with
      # -replace so the Job is destroyed and recreated. The user-assigned identity and its
      # AcrPull role assignment (which do NOT depend on the Job) are created first, so the
      # fresh Job is provisioned with pull access already in place. The recreate also
      # auto-enables the Job-ONLY seed image (TF_VAR_market_data_refresh_job_use_seed_image,
      # set from this input in the env block) so the create never blocks on an ACR pull —
      # without touching the four long-running apps. deploy-azure.yml then rolls the real image.
      - name: Terraform Plan (apply — for assertions)
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.recreate_market_data_job }}" = "true" ]; then
            echo "Recovery requested: replacing azurerm_container_app_job.market_data_refresh"
            terraform plan -replace=azurerm_container_app_job.market_data_refresh -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Terraform Show (JSON — apply)
        run: terraform show -json tfplan > tfplan.json

      - name: Assert Plan — No in-place Job identity migration (MANDATORY)
        # Blocks a plain apply from planning the SystemAssigned -> UserAssigned in-place
        # migration (which can stall on ACA Job provisioning) and steers the operator to
        # rerun with recreate_market_data_job=true (forced -replace).
        run: python3 scripts/assert_job_identity_migration.py tfplan.json

      - name: Assert Plan — Recovery is Job-scoped (recovery only)
        if: github.event.inputs.recreate_market_data_job == 'true'
        run: python3 scripts/assert_recovery_plan.py tfplan.json

      - name: Assert Plan — P1 Profile Mutual Exclusion (MANDATORY)
        run: python3 scripts/assert_plan.py tfplan.json

      - name: Assert Plan — P5 ACR Pull Authorization (MANDATORY)
        run: python3 scripts/test_acr_pull_property.py tfplan.json

      - name: Assert Plan — Observability Caps, Budget, No Scheduled Alerts (MANDATORY)
        run: python3 scripts/assert_observability_plan.py tfplan.json

      - name: Assert Plan — Job runner env update is in-place (MANDATORY)
        run: python3 scripts/assert_job_runner_env_update.py tfplan.json

      - name: Assert Plan — ingress_enabled does not replace gateway (MANDATORY)
        run: python3 scripts/assert_ingress_enabled_plan.py tfplan.json

      - name: Assert Plan — Mongo repair Job contract (MANDATORY)
        run: python3 scripts/assert_mongo_repair_job_plan.py tfplan.json

      - name: Assert Plan — Spec A 9.9 exact scope (enable profile)
        if: github.event.inputs.change_profile == 'spec-a-9.9-enable'
        run: python3 scripts/assert_spec_a_9_9_plan.py tfplan.json --profile enable

      - name: Assert Plan — Spec A 9.9 exact scope (abort profile)
        if: github.event.inputs.change_profile == 'spec-a-9.9-abort'
        run: python3 scripts/assert_spec_a_9_9_plan.py tfplan.json --profile abort

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
