name: CI Verification Pipeline

on:
  push:
    branches: ["main", "architecture/**", "feature/**"]
  pull_request:
    branches: ["main", "architecture/**"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Changed-path classification
  #
  # Publishes `docs_only`, which `unit-tests` consumes as its skip condition.
  # The classifier is a SKIP allowlist: anything unrecognised forces the full
  # suite, so a new module can only ever over-test. It fails closed on empty
  # diffs, missing SHAs, git failure, and every non-pull_request event.
  #
  # No top-level `paths:` filter is used on this workflow, and none may be added:
  # a workflow skipped by path filtering leaves its required checks Pending
  # forever, which blocks the PR instead of passing it.
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `base...head` is a three-dot diff against the merge base; a shallow
          # clone cannot resolve it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify changed paths
        id: classify
        # Inputs go through env rather than direct ${{ }} interpolation into the
        # shell, so nothing from the event payload is ever expanded as script.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/classify_changed_paths.py \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

  static-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static sanitizer wiring guard
        run: |
          cd scripts && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=low && node check-sanitizer-secret-wiring.js

      - name: B1 seed-version caller inventory guard
        run: |
          python scripts/tests/test_check_b1_seed_version_callers.py -v
          python scripts/check-b1-seed-version-callers.py

      - name: B1 seed shell request-capture tests
        run: python scripts/tests/test_seed_portfolio_with_version.py -v

      - name: Master-plan status propagation contract tests
        run: python scripts/tests/test_master_plan_status_propagation.py -v

      - name: B2 demo golden-state oracle contract tests
        run: python scripts/tests/test_derive_demo_golden_state.py -v

      - name: Changed-path classifier contract tests
        # Deliberately here rather than in deploy-workflow-contract: static-guard
        # is a required check and never skips, so a broken classifier cannot
        # merge. deploy-workflow-contract is advisory and would not enforce this.
        run: python scripts/tests/test_classify_changed_paths.py -v

  deploy-workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wave P deploy-azure service-allowlist contract
        run: |
          python scripts/tests/test_resolve_deploy_selection.py
          python scripts/tests/test_deploy_azure_service_allowlist.py
          python scripts/tests/test_snapshot_container_apps.py
          python scripts/tests/test_resolve_digest_deploy.py
          python scripts/tests/test_deploy_azure_prebuilt_digest.py

      - name: Deploy-pipeline hardening contract (Spec A checkpoint-9.8 incident)
        run: |
          python scripts/tests/test_validate_deploy_dispatch.py
          python scripts/tests/test_deploy_pipeline_hardening.py

      - name: Terraform-azure scripts contract (Spec A checkpoint-9.9 prerequisite)
        # Previously never run in CI at all — infrastructure/terraform/azure/scripts/'s own
        # unit tests (the plan-assertion scripts terraform-azure.yml runs against tfplan.json)
        # existed only as local/manual-run developer tests. Brings the full suite in for the
        # first time, alongside the new dispatch-validation and 9.9-scope-assertion tests.
        run: python -m unittest discover -s infrastructure/terraform/azure/scripts -p "test_*.py" -v

      - name: Terraform-azure workflow hardening contract (Spec A checkpoint-9.9 prerequisite)
        run: python scripts/tests/test_terraform_azure_workflow_hardening.py

      - name: Install pinned actionlint (GitHub Actions schema validation)
        # Text-based contract tests above only prove intent, not that GitHub's Actions
        # schema actually accepts the YAML — that gap let an invalid `environment:` on a
        # `uses:` job pass every other check on PR #139 (Spec A checkpoint-9.8 review).
        # Pinned to a specific version + verified checksum, not a floating action tag,
        # for the same reason the rest of this hardening avoids unverified assumptions.
        run: |
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint_1.7.7_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          ./actionlint -version

      - name: actionlint — deploy workflows
        # -shellcheck= disables actionlint's embedded-script shellcheck sub-linter: this
        # step exists to catch GitHub Actions *schema* violations (the environment:-on-
        # uses: bug this was added for), not to enforce shell-script hygiene across files
        # this PR doesn't touch. Confirmed locally that disabling it does not suppress
        # the schema check itself — re-verify with a deliberately reintroduced bug before
        # changing this flag.
        run: ./actionlint -shellcheck= .github/workflows/deploy.yml .github/workflows/deploy-azure.yml .github/workflows/deploy-aws.yml .github/workflows/ci-verification.yml .github/workflows/terraform-azure.yml .github/workflows/master-plan-status-propagation.yml .github/workflows/synthetic-monitoring.yml

  sanitizer-canary:
    runs-on: ubuntu-latest
    needs: static-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install sanitizer action dependencies
        working-directory: .github/actions/sanitize-playwright-artifacts
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=low

      - name: Run generated Playwright canary
        working-directory: .github/actions/sanitize-playwright-artifacts/test/canary
        run: |
          export GITHUB_WORKSPACE="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}"
          created_runner_temp=0
          if [ -z "${RUNNER_TEMP:-}" ]; then
            export RUNNER_TEMP="$(mktemp -d)"
            created_runner_temp=1
          fi
          cleanup() {
            if [ "$created_runner_temp" -eq 1 ]; then rm -rf "$RUNNER_TEMP"; fi
          }
          trap cleanup EXIT

          rm -rf test-results playwright-report
          if npm ci --ignore-scripts; then npm_status=0; else npm_status=$?; fi
          [ "$npm_status" -eq 0 ] || { echo "FAIL: npm ci failed"; exit 1; }

          if node sync-canary-playwright-version.js --check; then sync_status=0; else sync_status=$?; fi
          [ "$sync_status" -eq 0 ] || { echo "FAIL: canary Playwright version diverges from frontend/package-lock.json"; exit 1; }

          if npx playwright install --with-deps chromium; then install_status=0; else install_status=$?; fi
          [ "$install_status" -eq 0 ] || { echo "FAIL: playwright install failed"; exit 1; }

          if npx playwright test; then playwright_status=0; else playwright_status=$?; fi
          if [ "$playwright_status" -eq 0 ]; then echo "FAIL: canary spec unexpectedly passed"; exit 1; fi
          test -d test-results && test -d playwright-report \
            || { echo "FAIL: expected output directories missing"; exit 1; }
          zip_count=$(find playwright-report/data -maxdepth 1 -name '*.zip' | wc -l)
          [ "$zip_count" -eq 1 ] || { echo "FAIL: expected exactly 1 nested report zip, found $zip_count"; exit 1; }

          for root in playwright-report test-results; do
            staging1=$(node -e "const path=require('path'),crypto=require('crypto');console.log(path.join(process.env.RUNNER_TEMP,'canary-staging-'+crypto.randomBytes(8).toString('hex')))")
            if SANITIZE_SOURCE_DIR="$(pwd)/$root" SANITIZE_STAGING_DIR="$staging1" SANITIZE_MODE=fallback-only \
                node ../../sanitize.js; then s1=0; else s1=$?; fi
            [ "$s1" -eq 0 ] || { echo "FAIL: dirty-proof sanitize aborted for $root"; exit 1; }
            diff -rq "$root" "$staging1" > /dev/null && { echo "FAIL: $root staging identical to source — sentinel not detected"; exit 1; }

            clean_src="$(pwd)/.a13-clean-$root"
            rm -rf "$clean_src"
            cp -a "$staging1" "$clean_src"
            staging2=$(node -e "const path=require('path'),crypto=require('crypto');console.log(path.join(process.env.RUNNER_TEMP,'canary-staging-'+crypto.randomBytes(8).toString('hex')))")
            if SANITIZE_SOURCE_DIR="$clean_src" SANITIZE_STAGING_DIR="$staging2" SANITIZE_MODE=fallback-only \
                node ../../sanitize.js; then s2=0; else s2=$?; fi
            [ "$s2" -eq 0 ] || { echo "FAIL: clean-proof re-sanitize aborted for $root"; exit 1; }
            diff -rq "$clean_src" "$staging2" > /dev/null || { echo "FAIL: re-sanitized $root output not byte-identical — not actually clean"; exit 1; }
            rm -rf "$clean_src"
          done

          if node ../../known-assets-manifest-tool.js --verify playwright-report ../../known-playwright-report-assets.json; then
            manifest_status=0
          else
            manifest_status=$?
          fi
          [ "$manifest_status" -eq 0 ] || { echo "FAIL: manifest does not match real producer output"; exit 1; }

          echo "PASS: both roots proven dirty-then-clean; manifest verified"

      # Runs AFTER the canary step so the real Playwright report/trace it
      # generates exists on disk: allowlist.test.js reads
      # test/canary/playwright-report/trace/ assets, and this is the only place
      # in CI those are produced. On this Linux runner GNU /usr/bin/time -v is
      # present, so hostile-archive-resource.test.js's RSS bound also runs.
      - name: Run sanitizer Node test suite
        working-directory: .github/actions/sanitize-playwright-artifacts
        run: node --test test/*.test.js

  # ──────────────────────────────────────────────
  # Job 1: Unit tests (fast, no infrastructure)
  # ──────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: [static-guard, changes]
    # Stage B: the only skip condition in the graph. integration-tests,
    # pact-consumer and docker-build-verify carry no condition of their own —
    # they skip by needs-propagation from here. That keeps the skip set
    # downward-closed over the DAG by construction, so no job can be skipped
    # while something downstream of it still runs, and nothing needs always().
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper (retry on services.gradle.org flake)
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "Gradle wrapper download attempt $attempt failed; sleeping $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "Gradle wrapper bootstrap failed after 6 attempts."
          ./gradlew --version
          exit 1

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results on failure
        id: upload-unit-test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/reports/tests/"

  # ──────────────────────────────────────────────
  # Job 1b: Azure image probe smoke (packaging only)
  # ──────────────────────────────────────────────
  azure-image-smoke-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Azure image and run probe smoke cases
        run: |
          set -euo pipefail
          docker build -f api-gateway/Dockerfile.azure -t probe-smoke-test .

          run_case() {
            local label="$1"
            local env_value="$2"
            local expected="$3"
            local stdout_file stderr_file
            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"
            if docker run --rm --entrypoint java -e "INTERNAL_API_KEY=${env_value}" probe-smoke-test -jar /probe.jar \
              >"$stdout_file" 2>"$stderr_file"; then
              :
            else
              echo "::error::${label}: probe exited non-zero"
              echo "stdout:"; cat "$stdout_file"
              echo "stderr:"; cat "$stderr_file"
              exit 1
            fi
            if ! cmp -s "$stdout_file" <(printf '%s' "$expected"); then
              echo "::error::${label}: unexpected stdout (expected exact ${#expected} bytes)"
              echo "stdout:"; cat -A "$stdout_file"
              exit 1
            fi
            if [ -s "$stderr_file" ]; then
              echo "::error::${label}: stderr must be empty on success"
              echo "stderr:"; cat "$stderr_file"
              exit 1
            fi
          }

          run_case "blank case" "" $'blank\n'
          run_case "nonblank case" "smoke-test-value" $'nonblank\n'

  # ──────────────────────────────────────────────
  # Job 2: Integration tests (Testcontainers)
  # ──────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper (retry on services.gradle.org flake)
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "Gradle wrapper download attempt $attempt failed; sleeping $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "Gradle wrapper bootstrap failed after 6 attempts."
          ./gradlew --version
          exit 1

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Upload test results on failure
        id: upload-integration-test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/build/reports/tests/"

  # ──────────────────────────────────────────────
  # Job 3: Pact consumer contract tests (frontend)
  # ──────────────────────────────────────────────
  pact-consumer:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Pact consumer tests
        working-directory: frontend
        run: npm run test:pact

      - name: Upload Pact files
        id: upload-pact-contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: frontend/pacts/
          retention-days: 5

  # ──────────────────────────────────────────────
  # Job 4: Docker build, Pact provider verification,
  #         Playwright E2E, and publish to GHCR
  # ──────────────────────────────────────────────
  docker-build-verify:
    runs-on: ubuntu-latest
    needs: pact-consumer
    timeout-minutes: 45
    env:
      # Keep gateway JWT validation and frontend token minting aligned (non-empty secret required to sign tokens).
      AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'local-dev-secret-change-me-min-32-chars' }}
      # Vestigial Better Auth vars, commented out 2026-08-15 rather than deleted so the mapping
      # stays greppable if something turns out to read them. Better Auth was retired in PR #88
      # (ba_* tables dropped in V16); nothing in src/, the Vitest suite, or the Next.js build
      # reads either name. Remove these — and the NEXTAUTH_SECRET repository secret — once a
      # green run confirms nothing depends on them. See docs/todos/TODOS_2026-04-07.md.
      # BETTER_AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      # BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://wealth_user:wealth_pass@localhost:5432/portfolio_db
      # docker-compose.yml prefers Terraform-style interpolation, while Playwright
      # global-setup reads INTERNAL_API_KEY. Export both from the same GitHub secret.
      TF_VAR_internal_api_key: ${{ secrets.TF_VAR_INTERNAL_API_KEY }}
      INTERNAL_API_KEY: ${{ secrets.TF_VAR_INTERNAL_API_KEY }}
      # Same secrets as synthetic-monitoring.yml — Playwright helpers login as
      # the Golden-State E2E user, not the local-dev account.
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Pact contracts
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: frontend/pacts/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper (retry on services.gradle.org flake)
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "Gradle wrapper download attempt $attempt failed; sleeping $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "Gradle wrapper bootstrap failed after 6 attempts."
          ./gradlew --version
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build all service images via Docker Compose ──
      - name: Build Docker images
        run: docker compose build

      # ── Pact provider verification (MockMvc, no running containers needed) ──
      - name: Run Pact provider verification
        run: ./gradlew :portfolio-service:test --tests '*PactVerification*' :insight-service:test --tests '*PactVerification*' --no-daemon

      # ── Start Docker Compose stack and wait for health ──
      - name: Start Docker Compose stack
        run: |
          docker compose up -d
          echo "Waiting for services to become healthy (up to 6 minutes)..."

          SERVICES=(portfolio-service market-data-service insight-service api-gateway)

          for i in $(seq 1 36); do
            sleep 10
            echo "--- Health check attempt $i/36 ---"

            HEALTHY=0
            for svc in "${SERVICES[@]}"; do
              # docker inspect returns the health status string directly — immune to
              # JSON format changes across Docker Compose CLI versions.
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "missing")
              echo "  $svc: $STATUS"
              [ "$STATUS" = "healthy" ] && HEALTHY=$((HEALTHY + 1))
            done

            echo "Healthy: $HEALTHY/${#SERVICES[@]}"
            if [ "$HEALTHY" -eq "${#SERVICES[@]}" ]; then
              echo "All services healthy!"
              exit 0
            fi
          done

          echo "Services failed to become healthy within 6 minutes"
          docker compose logs
          exit 1

      # ── Playwright E2E ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Auth preflight - JWT health self-check
        working-directory: frontend
        run: npx playwright test tests/e2e/auth-jwt-health.spec.ts --project=chromium --reporter=list

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: |
          npx playwright test \
            tests/e2e/golden-path.spec.ts \
            tests/e2e/dashboard-data.spec.ts \
            tests/e2e/mocked-chaos.spec.ts \
            tests/e2e/live-contract.spec.ts \
            tests/e2e/portfolio-deep-link.spec.ts \
            --project=chromium \
            --reporter=list

      # Live-stack synthetic monitoring against AWS / Azure used to run here on
      # every push to main. It was removed (2026-05-17) because it forced the
      # backend stack to wake from scale-to-zero on every commit and was a
      # secondary contributor to the May-2026 Azure cost spike. Live synthetic
      # monitoring is temporarily manual-only in synthetic-monitoring.yml to
      # prevent an unattended G5-like run while B1 G5 remains blocked; use
      # workflow_dispatch only after separately recorded owner authorization.

      # ── Failure handling ──
      # With --reporter=list no HTML report is generated; the actionable
      # artifacts are the per-failure traces + error-context snapshots that
      # Playwright writes to test-results/ (trace: retain-on-failure).
      - name: Sanitize Playwright artifacts
        id: sanitize
        if: failure()
        uses: ./.github/actions/sanitize-playwright-artifacts
        with:
          source-dir: frontend/test-results
          staging-dir: ${{ runner.temp }}/sanitized-output
          # live-secret, not fallback-only: this job now exports the real
          # E2E_TEST_USER_PASSWORD so the Playwright helpers can log in as the
          # Golden-State user. fallback-only scrubs the known default
          # passwords, so it cannot redact a secret value it was never given.
          mode: live-secret
          e2e-password: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload Playwright traces on failure
        id: upload-playwright-traces
        if: failure() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ${{ runner.temp }}/sanitized-output
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color > container-logs.txt 2>&1

      - name: Upload container logs on failure
        id: upload-container-logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: container-logs.txt
          retention-days: 14

      # ── Publish verified images to GHCR ──
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push verified images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG=${{ github.sha }}
          # Docker Compose names images as <project>-<service>
          PROJECT=$(basename $(pwd) | tr '[:upper:]' '[:lower:]')
          for SERVICE in portfolio-service market-data-service insight-service api-gateway; do
            COMPOSE_IMAGE="${PROJECT}-${SERVICE}"
            docker tag ${COMPOSE_IMAGE}:latest ${{ env.IMAGE_PREFIX }}/${SERVICE}:${TAG}
            docker tag ${COMPOSE_IMAGE}:latest ${{ env.IMAGE_PREFIX }}/${SERVICE}:latest
            docker push ${{ env.IMAGE_PREFIX }}/${SERVICE}:${TAG}
            docker push ${{ env.IMAGE_PREFIX }}/${SERVICE}:latest
          done

      # ── Cleanup ──
      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  # ──────────────────────────────────────────────
  # Aggregate required gate
  #
  # `always()` is correct on this job and on no other. It must still run when a
  # dependency was skipped or the run was cancelled, because GitHub reports a
  # skipped job as Success to branch protection: a chain that silently skipped
  # would otherwise merge green with no signal anywhere. `!cancelled()` would be
  # wrong here — it lets this gate itself skip, which reports Success.
  # ──────────────────────────────────────────────
  ci-required:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - static-guard
      - sanitizer-canary
      - unit-tests
      - azure-image-smoke-test
      - integration-tests
      - pact-consumer
      - docker-build-verify
    steps:
      - name: Enforce declared vs observed (fail closed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          echo "Observed dependency results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          echo "Classifier declared docs_only=${DOCS_ONLY:-unset}"

          # The classifier must have produced exactly one of two known values.
          # Empty or unexpected means the changes job malfunctioned, and a
          # malfunction must never read as "nothing left to verify".
          case "${DOCS_ONLY:-}" in
            true|false) ;;
            *)
              echo "::error::classifier produced no usable docs_only value (got '${DOCS_ONLY:-}'); refusing to infer"
              exit 1
              ;;
          esac

          # Derive the exact result every dependency must have from what the
          # classifier declared, then require an exact match. A skip is
          # acceptable only where it was declared, and a run only where it was
          # not. This is what stops a silent skip from merging green: GitHub
          # reports a skipped required job as Success to branch protection, so
          # equality here is the only thing standing between a mis-wired graph
          # and an unverified merge. Comparing against an exact expected value
          # also fails closed on failure, cancellation, and any conclusion
          # outside the known enum.
          mismatches=$(echo "$NEEDS_JSON" | jq -r --arg docs_only "$DOCS_ONLY" '
            . as $observed
            | (if $docs_only == "true" then "skipped" else "success" end) as $chain
            | {
                "changes": "success",
                "static-guard": "success",
                "sanitizer-canary": "success",
                "unit-tests": $chain,
                "azure-image-smoke-test": $chain,
                "integration-tests": $chain,
                "pact-consumer": $chain,
                "docker-build-verify": $chain
              }
            | to_entries
            | map(select(($observed[.key].result // "missing") != .value))
            | map("\(.key): expected \(.value), observed \($observed[.key].result // "missing")")
            | join("; ")')

          if [ -n "$mismatches" ]; then
            echo "::error::declared docs_only=$DOCS_ONLY but observed results disagree — $mismatches"
            exit 1
          fi

          echo "Declared and observed job results agree."

      - name: Evidence — declared vs observed
        # Step-level always(): without it this step is skipped whenever the
        # enforce step above fails, so the evidence went missing on exactly the
        # runs where it is most diagnostic (observed on run 33457730873).
        # This does not mask anything — a failed step fails the job regardless of
        # later always() steps, so the gate still reports red. It is also not a
        # breach of the job-level rule that only ci-required may use always():
        # that rule is about job conditions, and docker-build-verify already uses
        # a step-level always() for its cleanup.
        if: always()
        # The block below ends in `| tee -a`, not `>>`. The step summary is
        # UI-only — exposed by no REST endpoint and absent from the job log — so
        # redirecting there alone made this evidence unreadable to log- and
        # API-based review. tee puts it in both, matching what the classifier
        # script already does. This rationale lives here rather than inside the
        # run block because that block is extracted and executed verbatim by the
        # contract tests.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          {
            echo "### Aggregate gate — declared vs observed"
            echo
            echo "- classifier declared \`docs_only\`: **${DOCS_ONLY:-unset}**"
            if [ "${DOCS_ONLY:-}" = "true" ]; then
              echo "- expected skipped: unit-tests, azure-image-smoke-test,"
              echo "  integration-tests, pact-consumer, docker-build-verify"
            else
              echo "- expected the full suite to run"
            fi
            echo
            echo "| job | observed |"
            echo "| --- | --- |"
            echo "$NEEDS_JSON" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo
            echo "_Enforced: any disagreement between declared and observed fails this gate._"
          } | tee -a "$GITHUB_STEP_SUMMARY"
